<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="container">
        <header>
            <h1>Hello GitHub!!!</h1>
            <p>Fill in the details below to create a student profile. I'm Intern 1</p>
            <p>I'm Urvaaa Gandhi.</p>
        </header>

        <form>
            <div class="grid">
                <div class="field">
                    <label for="fullName">Full Name <span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter full name" required />
                </div>

                <div class="field">
                    <label for="studentId">Student ID <span class="required">*</span></label>
                    <input type="text" id="studentId" name="studentId" placeholder="Enter student ID" required />
                </div>

                <div class="field">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required />
                </div>

                <div class="field">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required />
                </div>

                <div class="field">
                    <label for="dob">Date of Birth <span class="required">*</span></label>
                    <input type="date" id="dob" name="dob" required />
                </div>

                <div class="field">
                    <label for="gender">Gender <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">Select gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not-to-say">Prefer not to say</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="course">Course / Program <span class="required">*</span></label>
                    <input type="text" id="course" name="course" placeholder="e.g. Computer Science" required />
                </div>

                <div class="field full">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Enter address"></textarea>
                </div>
            </div>

            <div class="actions">
                <button class="submit" type="submit">Register Student</button>
                <button class="reset" type="reset">Clear Form</button>
            </div>

            <p class="note">Fields marked with * are mandatory.</p>
        </form>
    </main>
</body>

</html>
